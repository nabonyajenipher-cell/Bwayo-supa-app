<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10251f"><title>Bwayo Chess</title>
<style>*{box-sizing:border-box}body{margin:0;padding:12px;background:linear-gradient(160deg,#102b46,#071522);color:#fff;font:600 14px system-ui;text-align:center}.top{max-width:560px;margin:auto}.title{font-size:25px;color:#ffe08a;margin:8px}.sub{color:#c9ddf2;font-size:11px;letter-spacing:1px}.status{margin:12px auto;padding:13px;border:1px solid #5796c4;border-radius:14px;background:#102c49;min-height:54px}.board{width:min(94vw,520px);aspect-ratio:1;margin:12px auto;display:grid;grid-template-columns:repeat(8,1fr);border:4px solid #d4b477;box-shadow:0 10px 25px #0008}.sq{border:0;border-radius:0;padding:0;display:grid;place-items:center;position:relative;font-family:'DejaVu Sans','Segoe UI Symbol',serif;font-size:clamp(27px,8vw,52px);line-height:1}.light{background:#f0d9b5;color:#171717}.dark{background:#9b6b45;color:#171717}.selected{box-shadow:inset 0 0 0 5px #ffdf45}.target:after{content:'';width:24%;height:24%;border-radius:50%;background:#176c39aa;position:absolute}.piece{filter:drop-shadow(0 2px 1px #0006)}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:900;background:#ffda77;color:#18283b}.btn.alt{background:#c5e2f8}.moves{max-width:520px;margin:12px auto;text-align:left;background:#102c49;padding:12px;border-radius:12px;color:#d9eafa;min-height:45px;overflow-wrap:anywhere}.note{font-size:11px;color:#c8d8e7}</style></head><body><main class="top"><div class="title">♟ BWAYO CHESS</div><div class="sub">OFFLINE TWO-PLAYER CHESS</div><div class="status" id="status">White to move. Select a piece, then its destination.</div><div class="board" id="board"></div><div class="controls"><button class="btn" onclick="undo()">↶ UNDO</button><button class="btn alt" onclick="reset()">NEW GAME</button><button class="btn alt" onclick="flip()">FLIP BOARD</button></div><div class="moves" id="moves">Moves will appear here.</div><div class="note">Standard chess: legal moves, check, checkmate, stalemate, castling, en passant and pawn promotion. Play locally with another person.</div></main>
<script>
const glyph={K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟︎','.':''},dirs={n:[-33,-31,-18,-14,14,18,31,33],b:[-17,-15,15,17],r:[-16,-1,1,16],k:[-17,-16,-15,-1,1,15,16,17]};
const on=i=>i>=0&&i<128&&!(i&0x88),side=p=>!p||p==='.'?0:p===p.toUpperCase()?1:-1,sq=i=>'abcdefgh'[i&7]+(8-(i>>4));
let state,history=[],selected=-1,flipped=false,legalMoves=[];
function initial(){return {b:'rnbqkbnrpppppppp................................PPPPPPPPRNBQKBNR'.split('').concat(Array(0)),t:1,c:15,ep:-1,half:0,full:1};}
function fresh(){let b=Array(128).fill('.');const rows=['rnbqkbnr','pppppppp','........','........','........','........','PPPPPPPP','RNBQKBNR'];rows.forEach((row,r)=>[...row].forEach((p,c)=>b[r*16+c]=p));return {b,t:1,c:15,ep:-1,half:0,full:1};}
function attacked(s,target,by){for(let f=0;f<128;f++){if(!on(f)||side(s.b[f])!==by)continue;let p=s.b[f].toLowerCase();if(p==='p'){if(target===f-16*by-1||target===f-16*by+1)return true;continue}for(let d of (dirs[p]||dirs.k)){for(let t=f+d;on(t);t+=d){if(t===target)return true;if(s.b[t]!=='.'||p==='n'||p==='k')break}}}return false}
function check(s,color=s.t){return attacked(s,s.b.indexOf(color===1?'K':'k'),-color)}
function apply(s,m){let [f,t,promo,flag]=m,b=s.b.slice(),piece=b[f],capt=b[t],c=s.c;b[f]='.';b[t]=promo?(s.t===1?promo.toUpperCase():promo):piece;if(flag==='ep')b[t+16*s.t]='.';if(flag==='castle'){let rf=t>f?f+3:f-4,rt=t>f?f+1:f-1;b[rt]=b[rf];b[rf]='.'}if(piece==='K')c&=~3;if(piece==='k')c&=~12;const rb={119:1,112:2,7:4,0:8};if(piece.toLowerCase()==='r')c&=~(rb[f]||0);if(capt.toLowerCase()==='r')c&=~(rb[t]||0);return {b,t:-s.t,c,ep:piece.toLowerCase()==='p'&&Math.abs(t-f)===32?(t+f)/2:-1,half:piece.toLowerCase()==='p'||capt!=='.'||flag==='ep'?0:s.half+1,full:s.full+(s.t===-1?1:0)}}
function pseudo(s){let out=[];for(let f=0;f<128;f++){if(!on(f)||side(s.b[f])!==s.t)continue;let p=s.b[f].toLowerCase(),add=(t,flag='')=>{if(s.b[t].toLowerCase()==='k')return;if(p==='p'&&(t>>4===0||t>>4===7))for(let q of ['q','r','b','n'])out.push([f,t,q,flag]);else out.push([f,t,'',flag])};if(p==='p'){let t=f-16*s.t;if(on(t)&&s.b[t]==='.'){add(t);let u=t-16*s.t;if(f>>4===(s.t===1?6:1)&&s.b[u]==='.')add(u)}for(let d of [-1,1]){let u=t+d;if(!on(u))continue;if(side(s.b[u])===-s.t)add(u);else if(u===s.ep&&s.b[u]==='.'&&s.b[u+16*s.t]===(s.t===1?'p':'P'))add(u,'ep')}}else{for(let d of (dirs[p]||dirs.k))for(let t=f+d;on(t);t+=d){if(side(s.b[t])===s.t)break;add(t);if(s.b[t]!=='.'||p==='n'||p==='k')break}let home=s.t===1?116:4,rook=s.t===1?'R':'r',bits=s.t===1?[1,2]:[4,8];if(p==='k'&&f===home&&!check(s)){if((s.c&bits[0])&&s.b[f+3]===rook&&s.b[f+1]==='.'&&s.b[f+2]==='.'&&!attacked(s,f+1,-s.t)&&!attacked(s,f+2,-s.t))add(f+2,'castle');if((s.c&bits[1])&&s.b[f-4]===rook&&s.b[f-1]==='.'&&s.b[f-2]==='.'&&s.b[f-3]==='.'&&!attacked(s,f-1,-s.t)&&!attacked(s,f-2,-s.t))add(f-2,'castle')}}}return out}
function legal(s){return pseudo(s).filter(m=>!check(apply(s,m),s.t))}
function status(){let ms=legal(state),c=check(state);if(!ms.length)return c?'Checkmate — '+(state.t===1?'Black':'White')+' wins!':'Draw — stalemate.';return (state.t===1?'White':'Black')+' to move'+(c?' — CHECK!':'')}
function render(){let board=document.getElementById('board');board.innerHTML='';legalMoves=legal(state);for(let v=0;v<64;v++){let r=Math.floor(v/8),c=v%8,rr=flipped?7-r:r,cc=flipped?7-c:c,i=rr*16+cc,el=document.createElement('button');el.className='sq '+((rr+cc)%2?'dark':'light');if(i===selected)el.classList.add('selected');if(legalMoves.some(m=>m[0]===selected&&m[1]===i))el.classList.add('target');el.innerHTML='<span class="piece">'+glyph[state.b[i]]+'</span>';el.onclick=()=>tap(i);board.appendChild(el)}document.getElementById('status').textContent=status();document.getElementById('moves').textContent=history.length?history.map((h,i)=>(i%2===0?Math.floor(i/2)+1+'. ':'')+h).join('  '):'Moves will appear here.'}
function tap(i){if(selected<0){if(side(state.b[i])===state.t){selected=i;render()}return}let choices=legalMoves.filter(m=>m[0]===selected&&m[1]===i);if(choices.length){let m=choices[0];if(m[2]){let q=prompt('Promote pawn to Q, R, B or N','Q');m=choices.find(x=>x[2]===String(q||'Q').toLowerCase())||choices[0]}let piece=state.b[m[0]],capture=state.b[m[1]]!=='.'||m[3]==='ep',notation=piece.toLowerCase()==='p'&&capture?sq(m[0])[0]+'x'+sq(m[1]):(piece.toUpperCase()==='P'?'':piece.toUpperCase())+(capture?'x':'')+sq(m[1])+(m[2]?'='+m[2].toUpperCase():'');state=apply(state,m);history.push(notation);selected=-1;render();return}selected=side(state.b[i])===state.t?i:-1;render()}
function undo(){if(!history.length)return;reset(false);let n=history.length-1,old=history.slice(0,n);old.forEach((_,i)=>{});/* history snapshots below */state=states[states.length-2];states.pop();history.pop();selected=-1;render()}
let states=[];
function reset(save=true){state=fresh();history=[];states=[JSON.parse(JSON.stringify(state))];selected=-1;if(save)render()}
const _apply=apply;
function tap(i){if(selected<0){if(side(state.b[i])===state.t){selected=i;render()}return}let choices=legalMoves.filter(m=>m[0]===selected&&m[1]===i);if(choices.length){let m=choices[0];if(m[2]){let q=(prompt('Promote pawn to Q, R, B or N','Q')||'Q').toLowerCase();m=choices.find(x=>x[2]===q)||choices[0]}let piece=state.b[m[0]],capture=state.b[m[1]]!=='.'||m[3]==='ep';let notation=m[3]==='castle'?(m[1]>m[0]?'O-O':'O-O-O'):(piece.toLowerCase()==='p'&&capture?sq(m[0])[0]+'x':'')+(piece.toUpperCase()==='P'?'':piece.toUpperCase())+(capture&&piece.toLowerCase()!=='p'?'x':'')+sq(m[1])+(m[2]?'='+m[2].toUpperCase():'');state=apply(state,m);history.push(notation);states.push(JSON.parse(JSON.stringify(state)));selected=-1;render();return}selected=side(state.b[i])===state.t?i:-1;render()}
function undo(){if(states.length<=1)return;states.pop();state=JSON.parse(JSON.stringify(states[states.length-1]));history.pop();selected=-1;render()}
function flip(){flipped=!flipped;render()}
reset();
</script></body></html>
