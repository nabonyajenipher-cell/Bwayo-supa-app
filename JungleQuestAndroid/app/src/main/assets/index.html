<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Jungle Quest</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#5b9f85,#173b2e 70%);color:white;font: bold 18px system-ui;text-align:center;height:100vh;overflow:hidden}h1{color:#ffd166}#world{height:60vh;margin:4vh 4vw;border:3px solid #d9c18b;border-radius:22px;background:linear-gradient(160deg,#8bc6a2,#28614b 55%,#543c27);position:relative;overflow:hidden}#hero{position:absolute;bottom:14%;left:12%;font-size:56px}#gem{position:absolute;right:18%;bottom:34%;font-size:30px}#beast{position:absolute;right:42%;bottom:13%;font-size:40px}button{padding:14px 18px;margin:5px;border:0;border-radius:14px;background:#ffd166;font-weight:900;font-size:17px}#hud{display:flex;justify-content:space-around}#msg{min-height:28px}</style></head><body><h1>🌿 JUNGLE QUEST</h1><div id="hud"><span>❤️ <b id="hp">3</b></span><span>💎 <b id="gems">0</b></span><span>🪙 <b id="coins">0</b></span><span>LEVEL <b id="level">1</b>/5</span></div><div id="world"><div id="hero">🧑🏾‍🌾</div><div id="gem">💎</div><div id="beast">🐆</div></div><div id="msg">Collect gems, dodge danger and find the temple!</div><button onclick="move(-1)">◀ LEFT</button><button onclick="jump()">⬆ JUMP</button><button onclick="dodge()">DODGE</button><button onclick="move(1)">RIGHT ▶</button><button onclick="attack()">⚔ ATTACK</button><script>let x=12,g=0,c=0,h=3,l=1,guard=0,weapon=0;function ui(){document.getElementById('hero').style.left=x+'%';document.getElementById('hp').textContent=h;document.getElementById('gems').textContent=g;document.getElementById('coins').textContent=c;document.getElementById('level').textContent=l}function move(d){x=Math.max(2,Math.min(88,x+d*8));if(x>72&&g>=5){if(l===5){document.getElementById('msg').textContent='🏆 You won the Golden Temple!';return}l++;g=0;x=12;document.getElementById('msg').textContent='Stage '+l+' unlocked!'}else if(x>72){document.getElementById('msg').textContent='Collect 5 gems to unlock the temple gate'}if(x>48&&x<70&&guard===0&&weapon===0){h--;document.getElementById('msg').textContent='🐆 Danger! Jump, dodge or attack next time';if(h<=0){h=3;x=12;g=0;document.getElementById('msg').textContent='Game over — try again!'}}if(x>30&&x<48){g++;c+=10;document.getElementById('gem').style.display='none';document.getElementById('msg').textContent='Gem collected! +10 coins'}ui();save()}function jump(){guard=1;document.getElementById('msg').textContent='⬆ Jump!';setTimeout(()=>guard=0,1300)}function dodge(){guard=1;document.getElementById('msg').textContent='🛡️ Dodge ready';setTimeout(()=>guard=0,1800)}function attack(){weapon=1;document.getElementById('msg').textContent='⚔️ Attack ready';setTimeout(()=>weapon=0,1800)}function save(){localStorage.setItem('jq',JSON.stringify({x,g,c,h,l}))}try{let s=JSON.parse(localStorage.getItem('jq'));if(s){({x,g,c,h,l}=s);ui()}}catch(e){}</script></body></html>
