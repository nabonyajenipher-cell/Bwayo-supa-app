name: Build Bwayo Super App APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bwayo-super-app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK to public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bwayo-v${{ github.run_number }}
          name: Bwayo Super App v${{ github.run_number }}
          body: Download app-debug.apk below and install it on your Android phone.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
