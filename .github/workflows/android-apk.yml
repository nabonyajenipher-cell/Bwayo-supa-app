name: Build Bwayo Super App (APK and AAB)
# Rebuild after removing the offline converter; app features otherwise unchanged.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Google Play upload signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BWAYO_UPLOAD_KEYSTORE_BASE64 }}
          BWAYO_KEYSTORE_PASSWORD: ${{ secrets.BWAYO_UPLOAD_STORE_PASSWORD }}
          BWAYO_KEY_ALIAS: ${{ secrets.BWAYO_UPLOAD_KEY_ALIAS }}
          BWAYO_KEY_PASSWORD: ${{ secrets.BWAYO_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$BWAYO_KEYSTORE_PASSWORD" ] || [ -z "$BWAYO_KEY_ALIAS" ] || [ -z "$BWAYO_KEY_PASSWORD" ]; then
            echo "::error::BWAYO signing secrets are required. Add all four BWAYO_UPLOAD_* repository secrets before building a release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bwayo-upload.jks"
          echo "BWAYO_KEYSTORE_PATH=$RUNNER_TEMP/bwayo-upload.jks" >> "$GITHUB_ENV"
          echo "BWAYO release signing key configured."
      - name: Build Android APK and release bundle
        env:
          BWAYO_KEYSTORE_PASSWORD: ${{ secrets.BWAYO_UPLOAD_STORE_PASSWORD }}
          BWAYO_KEY_ALIAS: ${{ secrets.BWAYO_UPLOAD_KEY_ALIAS }}
          BWAYO_KEY_PASSWORD: ${{ secrets.BWAYO_UPLOAD_KEY_PASSWORD }}
          BWAYO_KEYSTORE_PATH: ${{ env.BWAYO_KEYSTORE_PATH }}
        run: |
          gradle --no-daemon :app:assembleRelease :app:bundleRelease
      - name: Prepare clearly named files
        run: |
          cp app/build/outputs/apk/release/app-release.apk Bwayo-Super-App.apk
          cp app/build/outputs/bundle/release/app-release.aab Bwayo-Super-App.aab
      - uses: actions/upload-artifact@v4
        with:
          name: Bwayo-Super-App-Android-Files
          path: |
            Bwayo-Super-App.apk
            Bwayo-Super-App.aab
          if-no-files-found: error
      - name: Publish APK and AAB to public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bwayo-v${{ github.run_number }}
          name: Bwayo Super App v${{ github.run_number }}
          body: |
            Android APK: install directly on Android devices.
            Android App Bundle (AAB): signed for Google Play only when the owner has configured the four BWAYO_UPLOAD_* repository secrets.
          files: |
            Bwayo-Super-App.apk
            Bwayo-Super-App.aab
          make_latest: true
