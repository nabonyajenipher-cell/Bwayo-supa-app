name: Build Bwayo Music Studio APK
on:
  push:
    branches: [main]
    paths:
      - 'musicstudio/**'
      - 'settings.gradle.kts'
      - '.github/workflows/music-studio-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Bwayo Music Studio APK
        run: gradle --no-daemon :musicstudio:assembleDebug
      - name: Prepare APK
        run: cp musicstudio/build/outputs/apk/debug/musicstudio-debug.apk Bwayo-Music-Studio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Bwayo-Music-Studio-APK
          path: Bwayo-Music-Studio.apk
          if-no-files-found: error
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bwayo-music-studio-v${{ github.run_number }}
          name: Bwayo Music Studio v${{ github.run_number }}
          body: |
            Offline Android voice recorder with generated beat accompaniment.
            Install the APK directly on Android. Microphone permission is required.
          files: Bwayo-Music-Studio.apk
          make_latest: false
